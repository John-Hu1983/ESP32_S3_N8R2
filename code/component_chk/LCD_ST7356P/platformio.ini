; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-wroom-1-n8r2]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = espidf
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_size = 8MB
board_build.esp-idf.sdkconfig_path = sdkconfig.rymcu-esp32-s3-devkitc-1
board_build.partitions = partitions_8mb_large_app.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 7340032
upload_speed = 460800
monitor_speed = 115200
